<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Field Methods in Savanna Ecology — live shell</title>

<!--
  The MINIMAL live shell (#214). The only author-specific bits are the <title> above and, in the
  bootstrap below, the master filename + the edit switch. Everything else is PACKAGE plumbing,
  REFERENCED rather than copied (so it can't drift when the engine changes):
    • the shell chrome CSS — masthead (#206/#209) + edit-mode Write/Preview (#203) — ships as
      `src/shell/enscribe-shell.css` and is <link>ed below (kept out of default.css per #206);
    • the default editor adapter ships as `src/shell/editor-codemirror.js` and is imported below.
  Per #213 the core engine stays editor-agnostic; CodeMirror is host-side and loaded ONLY when
  editing is on. Read by default; flip editing on with `?edit` or a `data-enscribe-edit` on the
  mount <div>.

  Serve over HTTP from the PACKAGE root (so the dev/package-relative paths resolve):
      cd packages/enscribe && python3 -m http.server 8000
      # read:  http://localhost:8000/test/fixtures/master-book/index.html
      # edit:  http://localhost:8000/test/fixtures/master-book/index.html?edit
  The dev/package-relative paths here are a fixture convenience; a packaged shell / `enscribe serve`
  resolves real deploy paths (the shell emitter — a follow-on). The KaTeX/fonts CDN links are
  document-display assets (a separate asset-mode concern), not shell chrome.
-->
<link rel="stylesheet" href="../../../src/interpreter/assets/default.css">
<link rel="stylesheet" href="../../../src/shell/enscribe-shell.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.45/dist/katex.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,600;0,700;1,400;1,700&family=Source+Code+Pro:wght@400&display=swap">
</head>
<body>
<!-- Add `data-enscribe-edit` here to default this shell to the editor; or use `?edit`. -->
<div id="enscribe-book-root"></div>

<!-- The engine bundle (IIFE → window.enscribe). Rebuild with `npm run build:lib`. -->
<script src="../../../dist/enscribe.browser.global.js"></script>

<script type="module">
  // The default editor adapter ships with the package (CodeMirror loaded host-side, only when
  // editing is on — importing this module loads nothing). A host could pass its own factory.
  import { codeMirrorEditorFactory } from '../../../src/shell/editor-codemirror.js';

  // The #213 host switch: `?edit` flips it without editing this file; otherwise a
  // `data-enscribe-edit` on the mount <div> decides (default: read). The engine is unchanged.
  const opts = { editorFactory: codeMirrorEditorFactory };
  if (new URLSearchParams(location.search).has('edit')) opts.edit = true;

  window.enscribe
    .mountLiveBookShell('#enscribe-book-root', 'master-book.emd', opts)
    .catch((err) => {
      document.getElementById('enscribe-book-root').textContent = 'Failed to mount the live shell: ' + err.message;
      // eslint-disable-next-line no-console
      console.error(err);
    });
</script>
</body>
</html>
