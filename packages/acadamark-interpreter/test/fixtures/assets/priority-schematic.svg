<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 380" font-family="Georgia, serif">
  <!-- Background -->
  <rect width="500" height="380" fill="#fafafa"/>

  <!-- Grid lines -->
  <line x1="70" y1="30" x2="70" y2="300" stroke="#e8e8e8" stroke-width="1"/>
  <line x1="160" y1="30" x2="160" y2="300" stroke="#e8e8e8" stroke-width="1"/>
  <line x1="250" y1="30" x2="250" y2="300" stroke="#e8e8e8" stroke-width="1"/>
  <line x1="340" y1="30" x2="340" y2="300" stroke="#e8e8e8" stroke-width="1"/>
  <line x1="430" y1="30" x2="430" y2="300" stroke="#e8e8e8" stroke-width="1"/>

  <line x1="70" y1="300" x2="430" y2="300" stroke="#e8e8e8" stroke-width="1"/>
  <line x1="70" y1="237" x2="430" y2="237" stroke="#e8e8e8" stroke-width="1"/>
  <line x1="70" y1="175" x2="430" y2="175" stroke="#e8e8e8" stroke-width="1"/>
  <line x1="70" y1="113" x2="430" y2="113" stroke="#e8e8e8" stroke-width="1"/>
  <line x1="70" y1="50" x2="430" y2="50" stroke="#e8e8e8" stroke-width="1"/>

  <!-- Equal-weight diagonal line (α = 0.5): from low-importance/low-gap to high/high -->
  <line x1="70" y1="300" x2="430" y2="50" stroke="#aaa" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Axes -->
  <line x1="70" y1="30" x2="70" y2="310" stroke="#333" stroke-width="1.5"/>
  <line x1="60" y1="300" x2="440" y2="300" stroke="#333" stroke-width="1.5"/>

  <!-- X-axis ticks and labels: Evidence gap (0 to 1) -->
  <line x1="70"  y1="300" x2="70"  y2="306" stroke="#333" stroke-width="1"/>
  <text x="70"  y="320" text-anchor="middle" font-size="11" fill="#555">0</text>
  <line x1="160" y1="300" x2="160" y2="306" stroke="#333" stroke-width="1"/>
  <text x="160" y="320" text-anchor="middle" font-size="11" fill="#555">0.25</text>
  <line x1="250" y1="300" x2="250" y2="306" stroke="#333" stroke-width="1"/>
  <text x="250" y="320" text-anchor="middle" font-size="11" fill="#555">0.50</text>
  <line x1="340" y1="300" x2="340" y2="306" stroke="#333" stroke-width="1"/>
  <text x="340" y="320" text-anchor="middle" font-size="11" fill="#555">0.75</text>
  <line x1="430" y1="300" x2="430" y2="306" stroke="#333" stroke-width="1"/>
  <text x="430" y="320" text-anchor="middle" font-size="11" fill="#555">1.0</text>

  <!-- X-axis label -->
  <text x="250" y="345" text-anchor="middle" font-size="12" fill="#333" font-style="italic">Evidence gap, g</text>

  <!-- Y-axis ticks and labels: Community importance (1 to 5) -->
  <line x1="70" y1="300" x2="64" y2="300" stroke="#333" stroke-width="1"/>
  <text x="59" y="304" text-anchor="end" font-size="11" fill="#555">1</text>
  <line x1="70" y1="237" x2="64" y2="237" stroke="#333" stroke-width="1"/>
  <text x="59" y="241" text-anchor="end" font-size="11" fill="#555">2</text>
  <line x1="70" y1="175" x2="64" y2="175" stroke="#333" stroke-width="1"/>
  <text x="59" y="179" text-anchor="end" font-size="11" fill="#555">3</text>
  <line x1="70" y1="113" x2="64" y2="113" stroke="#333" stroke-width="1"/>
  <text x="59" y="117" text-anchor="end" font-size="11" fill="#555">4</text>
  <line x1="70" y1="50"  x2="64" y2="50"  stroke="#333" stroke-width="1"/>
  <text x="59" y="54"  text-anchor="end" font-size="11" fill="#555">5</text>

  <!-- Y-axis label (rotated) -->
  <text transform="translate(22,175) rotate(-90)" text-anchor="middle" font-size="12" fill="#333" font-style="italic">Community importance, c</text>

  <!-- Data points: (g, c) → (x, y) mapping:
       x = 70 + g * 360
       y = 300 - (c - 1) * 62.5
       Quality of life:  g=0.80, c=5  → x=358, y=50
       Burnout:          g=0.90, c=4  → x=394, y=113
       Diagnosis:        g=0.50, c=3  → x=250, y=175
       Education:        g=0.60, c=3  → x=286, y=175
       Employment:       g=0.70, c=4  → x=322, y=113
  -->

  <!-- Points (filled circles) -->
  <circle cx="358" cy="50"  r="7" fill="#0052cc" opacity="0.85"/>
  <circle cx="394" cy="113" r="7" fill="#e55c2f" opacity="0.85"/>
  <circle cx="250" cy="175" r="7" fill="#2ca02c" opacity="0.85"/>
  <circle cx="286" cy="175" r="7" fill="#9467bd" opacity="0.85"/>
  <circle cx="322" cy="113" r="7" fill="#8c6d31" opacity="0.85"/>

  <!-- Labels for data points -->
  <text x="365" y="47"  font-size="10" fill="#333">Quality of life</text>
  <text x="401" y="110" font-size="10" fill="#333">Burnout</text>
  <text x="218" y="192" font-size="10" fill="#333">Diagnosis</text>
  <text x="293" y="192" font-size="10" fill="#333">Education</text>
  <text x="329" y="107" font-size="10" fill="#333">Employment</text>

  <!-- Diagonal label -->
  <text x="380" y="145" font-size="10" fill="#999" transform="rotate(-36,380,145)">α = 0.5</text>
</svg>
