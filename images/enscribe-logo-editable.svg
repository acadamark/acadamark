<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
  <title id="title">enscribe logo wordmark</title>
  <desc id="desc">Editable lowercase serif enscribe wordmark with a custom inkpot and quill forming the b.</desc>
  <defs>
    <style>
      :root {
        --ink: #080808;
        --paper: #ffffff;
      }
      .word {
        font-family: Georgia, "Times New Roman", "Liberation Serif", serif;
        font-size: 180px;
        font-weight: 400;
        letter-spacing: 1.5px; /* adjust this for the editable text portions */
        fill: #080808;
      }
      .mark { fill: #080808; }
      .cut { fill: none; stroke: #ffffff; stroke-linecap: round; stroke-linejoin: round; }
      .rim { fill: none; stroke: #080808; stroke-width: 13; stroke-linecap: round; }
      .rim-cut { fill: none; stroke: #ffffff; stroke-width: 5; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <!--
    Hybrid editable construction:
    - The regular letters are live SVG text in two chunks.
    - The custom b is the vector group with id="b-inkpot-quill".
    - To adjust global spacing, edit .word letter-spacing, then nudge
      the transform on b-inkpot-quill and the x value on suffix-e.
  -->
  <g id="enscribe-wordmark" transform="translate(18 0)">
    <text id="prefix-enscri" class="word" x="35" y="260">enscri</text>

    <!-- custom b: solid inkwell plus light canted quill -->
    <g id="b-inkpot-quill" transform="translate(595 0) scale(0.86)">
      <!-- inkwell body -->
      <path class="mark" d="M45 214
        C25 225 18 248 25 269
        C34 299 115 300 126 270
        C134 248 126 225 106 214
        C97 209 91 202 90 194
        L61 194
        C60 202 54 209 45 214 Z"/>
      <!-- small foot/base -->
      <path class="mark" d="M32 295 C51 301 101 301 120 295 L124 303 C101 310 49 310 28 303 Z"/>
      <!-- rim -->
      <ellipse class="rim" cx="75" cy="192" rx="55" ry="10"/>
      <path class="rim-cut" d="M31 191 C50 197 101 197 120 191"/>

      <!-- quill shaft, emerging from the rim -->
      <path class="mark" d="M68 194 C77 149 96 97 132 47 L143 52 C107 102 88 151 78 198 Z"/>

      <!-- feather vane -->
      <path class="mark" d="M136 42
        C175 55 187 96 171 132
        C159 161 126 183 78 205
        C76 165 82 107 136 42 Z"/>

      <!-- feather centerline and cuts -->
      <path class="cut" stroke-width="6" d="M140 55 C116 89 93 139 78 197"/>
      <path class="cut" stroke-width="4" d="M122 89 C142 79 157 68 171 55"/>
      <path class="cut" stroke-width="4" d="M111 118 C136 111 153 99 171 83"/>
      <path class="cut" stroke-width="4" d="M99 148 C124 141 148 128 168 108"/>
      <path class="cut" stroke-width="4" d="M92 174 C116 167 139 154 159 134"/>
      <path class="cut" stroke-width="4" d="M91 107 C78 94 72 84 68 72"/>
      <path class="cut" stroke-width="4" d="M84 135 C70 124 63 112 59 99"/>
      <path class="cut" stroke-width="4" d="M79 163 C65 151 58 139 54 126"/>
    </g>

    <text id="suffix-e" class="word" x="745" y="260">e</text>
  </g>
</svg>
