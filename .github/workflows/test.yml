# CI — run the full test suite on every push and pull request (#49).
#
# One job on a current Node LTS (22; the packages declare engines ">=18"). Node 22 ships a global
# `navigator`, so the Node-20 abcjs `navigator` shim (#371) is a harmless no-op here. (Was Node 20,
# which GitHub is retiring on runners — #382.)
# It installs from the committed root lockfile, runs every workspace's `test`
# script (each package's own `pretest` compiles the Peggy grammar / runs the
# data-freshness guard first), then the enscribe `verify` script — which adds
# the `render-fixtures.js` pass that `npm test` alone skips, so fixture drift
# is caught in CI too.
#
# libxml2-utils provides `xmllint`, which the CLI package's JATS DTD-validation
# tests require. Locally xmllint comes from micromamba (~/micromamba/bin/xmllint);
# a clean runner has neither micromamba nor a guaranteed system xmllint, and
# those checks fail loudly rather than skip-and-stay-green — so the binary is
# installed explicitly here.

name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install xmllint (CLI JATS DTD validation)
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Provision a Chromium the delivery-modes browser tests (Tier 2, #369) can drive. puppeteer-core
      # (a packages/cli devDependency) ships no browser, and the test's findChromium() resolves the
      # PLAYWRIGHT cache layout (~/.cache/ms-playwright/chromium-*/…) — it ignores
      # PUPPETEER_EXECUTABLE_PATH — so `playwright install` is the zero-test-change provisioning path.
      # `--with-deps` also apt-installs the shared libraries headless Chromium needs on a clean runner.
      # Without this the Tier 2 checks skip (green); with it they RUN (offline render + editor mount).
      - name: Provision Chromium for the browser tests (delivery Tier 2)
        run: npx playwright install --with-deps chromium

      # #373: guard the GENERATED docs pages (docs-source/) against drift from the generator — the
      # repo-level analogue of each package's check-data-fresh pretest. Fails loudly (with a "run the
      # docs generator" message) if a committed docs page no longer matches docs-gen/generate-docs.mjs.
      - name: Docs-source freshness guard (#373)
        run: npm run docs:check

      # Repo-split Stage 0 (notes/enscribe-split-migration-plan.md): the language layer
      # (packages/ehtml + the notes/ prose surface) never imports the engine, and nothing outside
      # it reaches language internals by path — cross-boundary consumption is by package name only.
      - name: Language/engine boundary check (repo-split Stage 0)
        run: npm run check:boundary

      # #390: guard the committed live-example pages (examples/*/index.html are emitter-generated
      # and committed) against emitter drift — regenerate-to-temp and byte-compare, the examples/
      # analogue of the docs-source guard above. Needs the built browser bundle (npm ci's prepare).
      - name: Live-examples freshness guard (#390)
        run: npm run examples:check

      # #404/#405: the routing invariant — every id on exactly one page; every href resolves or
      # routes to the not-found view — checked over the real built corpus, INCLUDING the degraded
      # website (one failed page): the invariant holds THROUGH failure. Builds with the real CLI.
      - name: Routing invariant gate (#404)
        run: npm run check:routing

      - name: Theme-token contract freshness guard (#398)
        run: npm run check:theme-tokens
      - name: Dark-variant freshness + contrast gate (#398)
        run: npm run check:dark

      # The flagship builds with zero unexplained diagnostics — every warning the docs emit is
      # embedded into the deployed page as a console recap (#415), so the docs must hold to the
      # standard they preach. Survivors are individually justified in the guard's allowlist.
      - name: Docs-clean gate (flagship builds clean)
        run: npm run check:docs-clean

      - name: Run workspace test suites
        run: npm test --workspaces --if-present

      - name: Verify enscribe (test suites + render-fixtures)
        run: npm run verify --workspace packages/enscribe
